<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routy 지원</title>
    <style>
      :root { color-scheme: light; --bg:#f4f6fb; --surface:#fff; --text:#1f2937; --muted:#6b7280; --line:#d7deea; --brand:#3358c8; --brand-soft:#e8eeff; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#eef3ff 0%,var(--bg) 100%); color:var(--text); line-height:1.6; }
      .page { width:min(960px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
      .hero,.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 30px rgba(31,41,55,.06); }
      .hero { padding:28px; margin-bottom:20px; }
      .card { padding:24px; margin-top:20px; }
      .badge { display:inline-flex; padding:6px 10px; border-radius:999px; background:var(--brand-soft); color:var(--brand); font-size:13px; font-weight:700; margin-bottom:14px; }
      h1,h2 { margin:0; }
      h1 { font-size:30px; line-height:1.2; margin-bottom:10px; }
      h2 { font-size:22px; line-height:1.25; margin-bottom:14px; }
      p { margin:0 0 12px; }
      ul { margin:0; padding-left:20px; }
      li + li { margin-top:8px; }
      .muted { color:var(--muted); }
      .contact-box { margin-top:16px; padding:16px; border-radius:16px; background:var(--brand-soft); border:1px solid #cfd9ff; }
      .contact-box a { color:var(--brand); font-weight:700; text-decoration:none; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="badge">Routy 지원</div>
        <h1>Routy 지원</h1>
        <p>Routy 앱 지원 페이지입니다.</p>
        <p class="muted">공개 전에 아래 이메일을 실제 지원 메일로 교체하세요.</p>
        <div class="contact-box">
          <p><strong>지원 이메일</strong></p>
          <p><a href="mailto:support@example.com">support@example.com</a></p>
        </div>
      </section>

      <section class="card">
        <h2>문의 방법</h2>
        <ul>
          <li>위 이메일로 문의해 주세요.</li>
          <li>앱 버전, iPhone 기기명, iOS 버전, 문제 내용을 함께 적어 주세요.</li>
          <li>가능하면 스크린샷을 같이 보내 주세요.</li>
          <li>알림, 가져오기, 백업 문제는 재현 절차를 함께 적어 주세요.</li>
        </ul>
      </section>
    </main>
  </body>
</html>
