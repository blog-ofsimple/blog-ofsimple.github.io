<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // query + hash까지 포함해서 원래 URL을 최대한 정확히 보존
    var full = window.location.pathname + window.location.search + window.location.hash;

    // 선행 "/" 제거해서 index.html에서 복원하기 쉽게 (ex: "dev-tools/markdown-editor?x=1#y")
    var normalized = full.replace(/^\/+/, "");

    // 무한 루프 방지
    if (normalized.startsWith("index.html")) {
      window.location.replace("/");
    } else {
      window.location.replace("/index.html?redirect=" + encodeURIComponent(normalized));
    }
  </script>
</head>
<body></body>
</html>
