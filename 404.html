<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // 커스텀 도메인 기준: /index.html?redirect=... 로만 보낸다.
    const fullPath = location.pathname + location.search;
    // 선행 "/" 제거해서 index.html에서 정확히 복원되도록 처리
    const normalized = fullPath.replace(/^\/+/, "");
    // 이미 index.html로 들어온 경우에는 루트로 복귀
    if (normalized.startsWith("index.html")) {
      location.replace("/");
    } else {
      location.replace(`/index.html?redirect=${encodeURIComponent(normalized)}`);
    }
  </script>
</head>
<body></body>
</html>
