<!doctype html>
<html><head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
        (function () {
            var l = window.location;
            var target = (l.pathname + l.search + l.hash).replace(/^\/+/, "/");
            var url = "/?redirect=" + encodeURIComponent(target);
            l.replace(url);
        })();
    </script>
</head><body>Redirecting...</body></html>
