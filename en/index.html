    <style>
        :root{
            --primary:#1976d2;
            --bg:#f5f5f5;                /* background.default */
            --panel:#1976d2;             /* AppBar */
            --panel-border:rgba(0,0,0,0.08);
            --card:#ffffff;              /* background.paper */
            --card-border:#e5e7eb;
            --text:#1a1d26;              /* text.primary */
            --text-dim:#4b5563;          /* text.secondary */
            --hover:#eef1f4;

            --ROW-H: 64px;
            --ROW-W: clamp(260px, 22vw, 340px);  /* PC 기본 폭 (4열 기준) */
            --footer-h: 56px;
        }

        html,body{margin:0;padding:0;height:100%}
        html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}
        body{
            font-family:"Roboto","Noto Sans KR","Apple SD Gothic Neo","Helvetica",sans-serif;
            font-size:13px;
            color:var(--text); background:var(--bg);
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            width:100%; overflow-x:hidden; -webkit-text-size-adjust:100%;
        }
        body.landing{
            overflow:hidden;
        }
        html.landing{
            overflow:hidden;
        }

        #landing-shell{
            position:fixed;
            inset:0;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
            scrollbar-width:none;
        }
        #landing-shell::-webkit-scrollbar{
            width:0;
            height:0;
        }
        a{color:inherit;text-decoration:none}
        input,textarea,select,button{font-size:16px}

        /* Header */
        .topbar{
            height:64px; display:flex; align-items:center; justify-content:space-between;
            padding:0 20px; background:var(--primary); border-bottom:1px solid var(--panel-border);
        }
        .brand{font-weight:700;color:#fff;opacity:.95}

        /* Layout */
        .container{ width:100%; max-width:1760px; margin:0 auto; 
            line-height: 1.235;
            padding:10px 20px 24px 
        
        }
        .pb-footer{ padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px)) }

        /* Hero */
        .hero{ text-align:center; margin:0px 0 14px }
        .hero-title{ font-size:1.973214rem; font-weight:800; margin:2px 0 6px }
        .hero-desc{
            color:var(--text-dim);
            font-size:0.75rem;
            line-height:1.6;
            margin:0 0 6px;
        }
        .hero-break{ display:none }

        /* Search */
        .search-local{ display:flex; justify-content:center; padding:8px 0 6px }
        .search-inner{ width:clamp(420px,60vw,820px); position:relative }
        .search-input{
            width:100%; height:34px; font-size:0.75rem;
            padding:0 12px 0 40px; border-radius:8px;
            border:1px solid #c9c9c9; color:var(--text);
            outline:none; transition:border-color .15s, box-shadow .15s;

            /* background:var(--card) !important;  */
             background-color: transparent;
             /* Safari / iOS 기본 스타일 제거 */
                -webkit-appearance: none;

                
        }
        .search-input::placeholder{ color:#9a9a9a }
        .search-input:focus{ border-color:#b5b5b5; box-shadow:none }
        .search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:20px; height:20px; opacity:.65 }
        .search-icon .material-icons-outlined{ font-size:20px; line-height:20px }

        /* Tabs */
        .tabs-shell{
            display:flex; align-items:center; gap:8px;
            /* border-bottom:1px solid var(--card-border); */
            padding:0;
            min-height:44px;
            margin-top:24px;
        }
        .tabs-local{
            display:flex; gap:0;
            overflow-x:auto; scroll-snap-type:x mandatory;
            flex:1; min-width:0;
            scrollbar-width:none;
            
        }
        .tabs-shell.no-scroll .tabs-local{
            justify-content:center;
        }
        .tabs-local::-webkit-scrollbar{ height:0 }
        .tab{
            padding:10px; cursor:pointer;
            background:transparent; border:0; color:var(--text-dim);
            white-space:nowrap; font-size:0.75rem; font-weight:600;
            transition:all .15s; scroll-snap-align:start;
            min-width:90px;
            text-align:center;
            font-weight: 700;;
        }
        .tab.active{ color:var(--primary); box-shadow:inset 0 -2px 0 var(--primary) }
        .tab-nav{
            width:28px; height:28px; border-radius:6px;
            border:0; background:transparent; color:var(--text-dim);
            display:grid; place-items:center; cursor:pointer; flex-shrink:0;
            transition:background .15s, border-color .15s, color .15s;
        }
        .tab-nav .material-icons-outlined{ font-size:20px; line-height:20px }
        .tab-nav:hover{ background:var(--hover); color:var(--primary) }
        .tab-nav[disabled]{ opacity:0; pointer-events:none }

        /* Rows */
        :root{
            --grid-gap: 8px;
        }
        .rows{
            display:flex;
            flex-wrap:wrap;
            gap:var(--grid-gap);
            justify-content:center;
            margin-top:24px;
        }
        .row{
            width:calc((100% - (var(--grid-gap) * 3)) / 4);
            border:1px solid var(--card-border);
            border-radius:8px;
            background:var(--card);
            display:flex; flex-direction:column;
        }
        .row-head{ display:flex; align-items:center; gap:12px; padding:6px 12px; min-height:var(--ROW-H) }
        .row-head-link{ display:contents }
        .row-icon{
            width:40px; height:40px; border-radius:8px;
            display:grid; place-items:center;
            background:var(--hover); color:var(--text-dim);
            flex-shrink:0; border:1px solid var(--card-border);
        }
        .row-icon .material-icons-outlined{ font-size:20px; line-height:20px }
        .row-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px }
        .row-title{
            margin:0;
            font-family:"Roboto","Helvetica","Arial",sans-serif;
            font-size:0.8125rem;
            line-height:1.75;
            letter-spacing:0.00938em;
            font-weight:700;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .row-acts{ display:flex; gap:8px; flex-shrink:0 }
        .link{
            padding:4px 10px; border-radius:8px; font-size:0.75rem;
            border:1px solid #d0d7e2; color:var(--primary); background:#fff;
            display:inline-flex; align-items:center; justify-content:center; min-height:28px;
        }
        .link.primary{ border-color:var(--primary); background:var(--primary); color:#fff }
        .row-desc{
            margin:0;
            font-family:"Roboto","Helvetica","Arial",sans-serif;
            font-weight:400;
            line-height:1.66;
            letter-spacing:0.03333em;
            white-space:nowrap;
            color:var(--text-dim);
            display:block;
            width:100%;
            overflow:hidden;
            text-overflow:ellipsis;
            font-size:0.67rem;
        }
        .empty{
            width:100%; text-align:center; color:var(--text-dim); padding:12px 0;
        }

        /* Footer */
        .footer{
            position:fixed; left:0; bottom:0; width:100%;
            height:var(--footer-h); display:flex; align-items:center; justify-content:center;
            background:var(--card); color:var(--text-dim); border-top:1px solid var(--card-border);
            z-index:1000; padding:0 16px;
            padding-bottom: calc(env(safe-area-inset-bottom,0px));
        }

        /* Toggle */
        #landing-shell{display:block}
        #root{display:none}

        /* AD */
        :root {
            --ad-h: 90px;
            --footer-h: 56px;
        }
        .container.pb-footer {
            padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px));
        }
        .ad-below-menu {
            width: 100vw;
            margin-left: 50%;
            transform: translateX(-50%);
            line-height: 0;
            background: var(--bg);
            padding: 6px 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .ad-below-menu .adsbygoogle {
            display: inline-block !important;
            margin: 0 auto !important;
        }
        .ad-pc { display:inline-block; }
        .ad-mo { display:none; }

        @media (max-width: 900px) {
            :root {
                --ad-h: 100px;
                --footer-h: 48px;
            }

            .ad-pc { display:none; }
            .ad-mo { display:inline-block; }

            .container.pb-footer {
                padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px));
            }
        }

        @supports (padding: max(0px)) {
            .ad-below-menu {
                padding-left:  max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
                padding-top: 20px;
            }
        }

        @media (max-width: 1399px) and (min-width: 1200px) {
            .row{
                width:calc((100% - (var(--grid-gap) * 2)) / 3);
            }
        }

        @media (max-width: 1199px) and (min-width: 901px) {
            .row{
                width:calc((100% - var(--grid-gap)) / 2);
            }
        }

        @media (max-width: 1400px) {
            :root{
                --ROW-W: clamp(260px, 26vw, 340px);
            }
        }

        @media (max-width: 1200px) {
            :root{
                --ROW-W: clamp(300px, 45vw, 420px);
            }
        }

        @media (max-width: 900px){
            :root{
                --ROW-W: min(94vw, 720px);
                --footer-h: 60px;
            }
            .container{ width:100%; padding:14px 12px 24px }
            .topbar{ height:56px; padding:0 12px }
            .hero-title{ font-size:26px }
            .hero-desc{ font-size:0.75rem }
            .hero-break{ display:inline }
            .search-inner{ width:min(92vw,720px) }
            .search-input{ height:44px; border-radius:12px }
            .search-icon .material-icons-outlined{ font-size:20px }
            .tabs-shell{ padding:8px 0 6px }
            .tabs-local{ gap:10px }
            .tab{ padding:7px 6px; font-size:0.75rem }
            .tab-nav{ width:26px; height:26px }
            .rows{
                gap:8px;
                justify-content:stretch;
            }
            .row{ width:100% }
            .row-head{ padding:8px 10px }
            .row-icon{ width:36px; height:36px; border-radius:7px }
            .row-icon .material-icons-outlined{ font-size:18px }
            .row-title{ font-size:0.8125rem }
            .row-acts{ gap:6px; flex-wrap:wrap; row-gap:4px }
            .link{ padding:2px 8px; font-size:0.75rem; min-height:24px }
            .row-desc{
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                line-height:1.2; font-size:0.67rem;
            }
            .pb-footer{ padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px)) }
        }
    </style>

    <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var redirect = params.get("redirect");
    if (!redirect) return;

    // redirect는 404에서 encodeURIComponent로 넣었으니 decode 후,
    // 앞의 "/"가 있든 없든 안전하게 정리
    var target = "/" + decodeURIComponent(redirect).replace(/^\/+/, "");

    // 주소를 "원래 서비스 URI"로 복원
    window.history.replaceState(null, "", target);
  })();
</script>

    <script type="text/javascript">
      ;(function () {
        var lastScrollY = 0
        var locked = false

        function isEditable(el) {
          if (!el) return false
          var tag = (el.tagName || '').toLowerCase()
          return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable
        }

        function lockScroll() {
          if (locked) return
          locked = true
          lastScrollY = window.scrollY || window.pageYOffset || 0
          document.body.style.position = 'fixed'
          document.body.style.top = -lastScrollY + 'px'
          document.body.style.left = '0'
          document.body.style.right = '0'
          document.body.style.width = '100%'
        }

        function unlockScroll() {
          if (!locked) return
          locked = false
          document.body.style.position = ''
          document.body.style.top = ''
          document.body.style.left = ''
          document.body.style.right = ''
          document.body.style.width = ''
          setTimeout(function () {
            window.scrollTo(0, lastScrollY)
            setTimeout(function () {
              window.scrollTo(0, lastScrollY)
            }, 50)
          }, 50)
        }

        window.addEventListener('focusin', function (e) {
          if (isEditable(e.target)) lockScroll()
        })

        window.addEventListener('focusout', function () {
          setTimeout(unlockScroll, 250)
        })
      })()
    </script>
</head>

<script type="module">
    const rootEl = document.getElementById('root');
    const landingShell = document.getElementById('landing-shell');
    const tabsEl = document.getElementById('tabs');
    const rowsEl = document.getElementById('rows');
    const yearEl = document.getElementById('year');
    const searchInput = document.getElementById('searchInput');
    const tabPrev = document.getElementById('tabPrev');
    const tabNext = document.getElementById('tabNext');
    yearEl.textContent = String(new Date().getFullYear());

    const routePrefixes = ['/tools/', '/dev-tools/', '/image/', '/statistics/', '/fun/', '/setting/', '/viewer/', '/game/'];
    const isGuidePath = location.pathname.includes('/guide/');
    const shouldShowLanding = !isGuidePath && !routePrefixes.some((prefix) => location.pathname.includes(prefix));

    const urlPlatform = new URL(location.href).searchParams.get("platform");
    const isCoarse = matchMedia("(pointer: coarse)").matches;
    const isFixedPlatform = urlPlatform === "pc" || urlPlatform === "mo";
    const resolvePlatform = () => {
        if (isFixedPlatform) return urlPlatform;
        return isCoarse || window.innerWidth <= 900 ? "mo" : "pc";
    };
    let currentPlatform = resolvePlatform();

    const isDevHost = /localhost|127\\.0\\.0\\.1|192\\.168\\.|0\\.0\\.0\\.0/.test(location.hostname);
    const CURRENT_ENV = isDevHost ? "development" : "production";

    const ICON_MAP = {
        AccessTime: "access_time",
        AutoAwesome: "auto_awesome",
        BarChart: "bar_chart",
        CodeOutlined: "code",
        Color: "palette",
        Description: "description",
        DescriptionOutlined: "description",
        DesignServicesOutlined: "design_services",
        Gamepad: "sports_esports",
        Grid4x4Outlined: "grid_4x4",
        HistoryOutlined: "history",
        MenuBook: "menu_book",
        MusicNote: "music_note",
        Numbers: "numbers",
        Pattern: "pattern",
        PhotoOutlined: "photo",
        QrCode: "qr_code",
        QueryStats: "query_stats",
        Schema: "schema",
        Search: "search",
        Settings: "settings",
        Storage: "storage",
        Straighten: "straighten",
        SyncAltOutlined: "sync_alt",
        TableChartRounded: "table_chart",
        Upcoming: "upcoming",
    };

    function mapIcon(iconName) {
        return ICON_MAP[iconName] || "extension";
    }

    function normalizePlatform(platforms) {
        if (!platforms || platforms.length === 0) return "both";
        const set = new Set(platforms);
        const hasPc = set.has("pc");
        const hasMo = set.has("mobile") || set.has("mo");
        if (hasPc && hasMo) return "both";
        if (hasMo) return "mo";
        return "pc";
    }

    function supportsPlatform(p = "both") {
        if (!p || p === "both") return true;
        return p === currentPlatform;
    }

    function supportsEnvironment(envs) {
        if (!envs || envs.length === 0) return true;
        return envs.includes(CURRENT_ENV);
    }

    function buildMenuData(config) {
        return (config || [])
            .filter(group => !(group.isHide ?? false))
            .map(group => {
                const children = (group.children || [])
                    .filter(child => child.type !== "divider")
                    .filter(child => !(child.isHide ?? false))
                    .filter(child => supportsEnvironment(child.environments))
                    .map(child => ({
                        label: child.label,
                        path: child.route,
                        icon: mapIcon(child.icon),
                        platforms: normalizePlatform(child.platform),
                        desc: child.description || "",
                    }))
                    .filter(child => supportsPlatform(child.platforms));

                return {
                    id: group.id,
                    label: groupLabel(group),
                    platforms: "both",
                    children,
                };
            })
            .filter(group => (group.children || []).length > 0);
    }

    let menuData = [];
    let rawMenuConfig = [];

    const THEME_STORAGE_KEY = 'setting';
    const DEFAULT_THEME_ID = 'default';
    const FALLBACK_THEME = {
        id: DEFAULT_THEME_ID,
        mode: 'light',
        palette: {
            primary: '#1976d2',
            primaryContrast: '#ffffff',
            background: { default: '#f5f5f5', paper: '#ffffff' },
            text: { primary: '#1a1d26', secondary: '#4b5563' },
        },
    };

    function parseStoredThemeId() {
        try {
            const raw = localStorage.getItem(THEME_STORAGE_KEY);
            if (!raw) return DEFAULT_THEME_ID;
            const parsed = JSON.parse(raw);
            return typeof parsed.theme === 'string' ? parsed.theme : DEFAULT_THEME_ID;
        } catch (e) {
            return DEFAULT_THEME_ID;
        }
    }

    function applyThemeVars(theme) {
        const root = document.documentElement;
        const palette = theme.palette || {};
        const bg = (palette.background || {}).default || FALLBACK_THEME.palette.background.default;
        const paper = (palette.background || {}).paper || FALLBACK_THEME.palette.background.paper;
        const primary = palette.primary || FALLBACK_THEME.palette.primary;
        const textPrimary = (palette.text || {}).primary || FALLBACK_THEME.palette.text.primary;
        const textSecondary = (palette.text || {}).secondary || FALLBACK_THEME.palette.text.secondary;
        const isDark = theme.mode === 'dark';

        root.style.setProperty('--primary', primary);
        root.style.setProperty('--bg', bg);
        root.style.setProperty('--card', paper);
        root.style.setProperty('--text', textPrimary);
        root.style.setProperty('--text-dim', textSecondary);
        root.style.setProperty('--panel', primary);
        root.style.setProperty('--panel-border', isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)');
        root.style.setProperty('--card-border', isDark ? '#2b2f36' : '#e5e7eb');
        root.style.setProperty('--hover', isDark ? 'rgba(255,255,255,0.08)' : '#eef1f4');
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
            themeMeta.setAttribute('content', primary);
        }
    }

    async function loadThemesAndApply() {
        const themeId = parseStoredThemeId();
        try {
            const res = await fetch('/themes.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error('themes.json fetch failed');
            const list = await res.json();
            const selected = (list || []).find((item) => item.id === themeId) || list?.[0] || FALLBACK_THEME;
            applyThemeVars(selected);
        } catch (e) {
            applyThemeVars(FALLBACK_THEME);
        }
    }

    async function loadMenu() {
        try {
            const res = await fetch("/menu.json", { cache: "no-cache" });
            if (!res.ok) throw new Error("menu.json fetch failed");
            const config = await res.json();
            rawMenuConfig = config;
            menuData = buildMenuData(config);
        } catch (e) {
            console.error(e);
            menuData = [];
        }
    }

    
    const GROUP_LABEL_EN = {"image_design_tools": "Image & Design", "utility_tools": "Life & Utilities", "fun_tools": "Fun & Experiments", "dev_markdown_tools": "Document Tools", "study_tools": "Study & Memorization", "statistics_tools": "Statistics", "convert_dev_tools": "Developer Tools", "coming_soon": "Coming Soon", "administration": "Settings", "games": "Games"};
    function groupLabel(group){
        if (!group) return '';
        const id = group.id;
        return (id && GROUP_LABEL_EN[id]) ? GROUP_LABEL_EN[id] : (group.label || '');
    }
function getPlatformGroups() {
        const allItems = menuData.flatMap((group) => group.children || []);
        return [{ label: "All", children: allItems }, ...menuData];
    }

    let activeTab = 0;
    // const basePath = location.pathname.replace(/\/index\.html$/, '/');
    // const baseUrl = `${location.origin}${basePath}`;
    const baseUrl = `${location.origin}/`;
    const guidePath = (p) => (p.endsWith('/') ? p + 'guide/' : p + '/guide/');
    const toAbsolute = (p) => new URL(p.replace(/^\//, ''), baseUrl).toString();

    function renderTabs(){
        const platformGroups = getPlatformGroups();
        if (activeTab >= platformGroups.length) activeTab = Math.max(platformGroups.length - 1, 0);

        tabsEl.innerHTML = '';
        platformGroups.forEach((g, idx) => {
            const el = document.createElement('span');
            el.className = 'tab' + (idx === activeTab ? ' active' : '');
            el.textContent = g.label;
            el.tabIndex = 0;
            el.addEventListener('click', () => { activeTab = idx; renderRows(); highlightTab(); });
            tabsEl.appendChild(el);
        });
        requestAnimationFrame(updateTabNav);
    }

    function highlightTab(){
        Array.from(tabsEl.children).forEach((el, i) => {
            el.classList.toggle('active', i === activeTab);
        });
        updateTabNav();
    }

    function updateTabNav(){
        const maxScroll = tabsEl.scrollWidth - tabsEl.clientWidth;
        if (maxScroll <= 0) {
            tabPrev.setAttribute('disabled', 'true');
            tabNext.setAttribute('disabled', 'true');
            tabsEl.parentElement.classList.add('no-scroll');
            return;
        }
        tabsEl.parentElement.classList.remove('no-scroll');
        tabPrev.toggleAttribute('disabled', tabsEl.scrollLeft <= 0);
        tabNext.toggleAttribute('disabled', tabsEl.scrollLeft >= maxScroll - 1);
    }

    tabPrev.addEventListener('click', () => {
        tabsEl.scrollBy({ left: -220, behavior: 'smooth' });
    });
    tabNext.addEventListener('click', () => {
        tabsEl.scrollBy({ left: 220, behavior: 'smooth' });
    });
    tabsEl.addEventListener('scroll', () => updateTabNav());
    window.addEventListener('resize', () => updateTabNav());

    function createRow(item){
        const row = document.createElement('div');
        row.className = 'row';

        const head = document.createElement('div');
        head.className = 'row-head';

        const icon = document.createElement('div');
        icon.className = 'row-icon';
        icon.innerHTML = `<span class="material-icons-outlined">${item.icon || 'extension'}</span>`;

        const textWrap = document.createElement('div');
        textWrap.className = 'row-text';

        const title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = item.label;

        const desc = document.createElement('div');
        desc.className = 'row-desc';
        desc.textContent = item.desc || '';

        textWrap.appendChild(title);
        textWrap.appendChild(desc);

        const acts = document.createElement('div');
        acts.className = 'row-acts';

        const aGuide = document.createElement('a');
        aGuide.className = 'link';
        aGuide.href = toAbsolute(guidePath(item.path));
        aGuide.textContent = 'Guide';

        const aRun = document.createElement('a');
        aRun.className = 'link primary';
        aRun.href = toAbsolute(item.path);
        aRun.textContent = 'Open';

        acts.appendChild(aGuide);
        acts.appendChild(aRun);

        head.appendChild(icon);
        head.appendChild(textWrap);
        head.appendChild(acts);

        row.appendChild(head);
        return row;
    }

    function renderRows(){
        const platformGroups = getPlatformGroups();
        const group = platformGroups[activeTab];
        if (!group) return;
        const keyword = (searchInput.value || '').toLowerCase().trim();

        rowsEl.innerHTML = '';
        let count = 0;
        (group.children || []).forEach(item => {
            const hay = (item.label + ' ' + (item.desc || '')).toLowerCase();
            if (keyword && !hay.includes(keyword)) return;
            rowsEl.appendChild(createRow(item));
            count += 1;
        });
        if (count === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No results';
            rowsEl.appendChild(empty);
        }
    }

    searchInput.addEventListener('input', () => renderRows());

    async function initLanding() {
        await loadThemesAndApply();
        await loadMenu();
        renderTabs();
        renderRows();
    }

    if (!shouldShowLanding) {
        landingShell.style.display = 'none';
        rootEl.style.display = 'block';
        document.body.classList.remove('landing');
        document.documentElement.classList.remove('landing');
    } else {
        document.body.classList.add('landing');
        document.documentElement.classList.add('landing');
        initLanding();
    }

    window.addEventListener('resize', () => {
        const nextPlatform = resolvePlatform();
        if (nextPlatform === currentPlatform) {
            updateTabNav();
            return;
        }
        currentPlatform = nextPlatform;
        menuData = buildMenuData(rawMenuConfig);
        activeTab = 0;
        renderTabs();
        renderRows();
    });

</script>
