    <!-- Material Icons Outlined -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        :root{
            --primary:#1976d2;
            --bg:#f5f5f5;                /* background.default */
            --panel:#1976d2;             /* AppBar */
            --panel-border:rgba(0,0,0,0.08);
            --card:#ffffff;              /* background.paper */
            --card-border:#e5e7eb;
            --text:#1a1d26;              /* text.primary */
            --text-dim:#4b5563;          /* text.secondary */
            --hover:#eef1f4;

            --ROW-H: 64px;
            --ROW-W: clamp(260px, 22vw, 340px);  /* PC 기본 폭 (4열 기준) */
            --footer-h: 56px;
        }

        html,body{margin:0;padding:0;height:100%}
        html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}
        body{
            font-family:"Roboto","Noto Sans KR","Apple SD Gothic Neo","Helvetica",sans-serif;
            font-size:13px;
            color:var(--text); background:var(--bg);
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
            width:100%; overflow-x:hidden; -webkit-text-size-adjust:100%;
        }
        body.landing{
            overflow:hidden;
        }
        html.landing{
            overflow:hidden;
        }

        #landing-shell{
            height:100vh;
            overflow-y:auto;
            scrollbar-width:none;
        }
        #landing-shell::-webkit-scrollbar{
            width:0;
            height:0;
        }
        a{color:inherit;text-decoration:none}
        input,textarea,select,button{font-size:16px}

        /* Header */
        .topbar{
            height:64px; display:flex; align-items:center; justify-content:space-between;
            padding:0 20px; background:var(--primary); border-bottom:1px solid var(--panel-border);
        }
        .brand{font-weight:700;color:#fff;opacity:.95}

        /* Layout */
        .container{ width:100%; max-width:1760px; margin:0 auto; 
            line-height: 1.235;
            padding:10px 20px 24px 
        
        }
        .pb-footer{ padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px)) }

        /* Hero */
        .hero{ text-align:center; margin:0px 0 14px }
        .hero-title{ font-size:1.973214rem; font-weight:800; margin:2px 0 6px }
        .hero-desc{
            color:var(--text-dim);
            font-size:0.75rem;
            line-height:1.6;
            margin:0 0 6px;
        }
        .hero-break{ display:none }

        /* Search */
        .search-local{ display:flex; justify-content:center; padding:8px 0 6px }
        .search-inner{ width:clamp(420px,60vw,820px); position:relative }
        .search-input{
            width:100%; height:34px; font-size:0.75rem;
            padding:0 12px 0 40px; border-radius:8px;
            border:1px solid #c9c9c9; color:var(--text);
            outline:none; transition:border-color .15s, box-shadow .15s;

            /* background:var(--card) !important;  */
             background-color: transparent;
             /* Safari / iOS 기본 스타일 제거 */
                -webkit-appearance: none;

                
        }
        .search-input::placeholder{ color:#9a9a9a }
        .search-input:focus{ border-color:#b5b5b5; box-shadow:none }
        .search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:20px; height:20px; opacity:.65 }
        .search-icon .material-icons-outlined{ font-size:20px; line-height:20px }

        /* Tabs */
        .tabs-shell{
            display:flex; align-items:center; gap:8px;
            /* border-bottom:1px solid var(--card-border); */
            padding:0;
            min-height:44px;
            margin-top:24px;
        }
        .tabs-local{
            display:flex; gap:0;
            overflow-x:auto; scroll-snap-type:x mandatory;
            flex:1; min-width:0;
            scrollbar-width:none;
            
        }
        .tabs-shell.no-scroll .tabs-local{
            justify-content:center;
        }
        .tabs-local::-webkit-scrollbar{ height:0 }
        .tab{
            padding:10px; cursor:pointer;
            background:transparent; border:0; color:var(--text-dim);
            white-space:nowrap; font-size:0.75rem; font-weight:600;
            transition:all .15s; scroll-snap-align:start;
            min-width:90px;
            text-align:center;
            font-weight: 700;;
        }
        .tab.active{ color:var(--primary); box-shadow:inset 0 -2px 0 var(--primary) }
        .tab-nav{
            width:28px; height:28px; border-radius:6px;
            border:0; background:transparent; color:var(--text-dim);
            display:grid; place-items:center; cursor:pointer; flex-shrink:0;
            transition:background .15s, border-color .15s, color .15s;
        }
        .tab-nav .material-icons-outlined{ font-size:20px; line-height:20px }
        .tab-nav:hover{ background:var(--hover); color:var(--primary) }
        .tab-nav[disabled]{ opacity:0; pointer-events:none }

        /* Rows */
        :root{
            --grid-gap: 8px;
        }
        .rows{
            display:flex;
            flex-wrap:wrap;
            gap:var(--grid-gap);
            justify-content:center;
            margin-top:24px;
        }
        .row{
            width:calc((100% - (var(--grid-gap) * 3)) / 4);
            border:1px solid var(--card-border);
            border-radius:8px;
            background:var(--card);
            display:flex; flex-direction:column;
        }
        .row-head{ display:flex; align-items:center; gap:12px; padding:6px 12px; min-height:var(--ROW-H) }
        .row-head-link{ display:contents }
        .row-icon{
            width:40px; height:40px; border-radius:8px;
            display:grid; place-items:center;
            background:var(--hover); color:var(--text-dim);
            flex-shrink:0; border:1px solid var(--card-border);
        }
        .row-icon .material-icons-outlined{ font-size:20px; line-height:20px }
        .row-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px }
        .row-title{
            margin:0;
            font-family:"Roboto","Helvetica","Arial",sans-serif;
            font-size:0.8125rem;
            line-height:1.75;
            letter-spacing:0.00938em;
            font-weight:700;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .row-acts{ display:flex; gap:8px; flex-shrink:0 }
        .link{
            padding:4px 10px; border-radius:8px; font-size:0.75rem;
            border:1px solid #d0d7e2; color:var(--primary); background:#fff;
            display:inline-flex; align-items:center; justify-content:center; min-height:28px;
        }
        .link.primary{ border-color:var(--primary); background:var(--primary); color:#fff }
        .row-desc{
            margin:0;
            font-family:"Roboto","Helvetica","Arial",sans-serif;
            font-weight:400;
            line-height:1.66;
            letter-spacing:0.03333em;
            white-space:nowrap;
            color:var(--text-dim);
            display:block;
            width:100%;
            overflow:hidden;
            text-overflow:ellipsis;
            font-size:0.67rem;
        }
        .empty{
            width:100%; text-align:center; color:var(--text-dim); padding:12px 0;
        }

        /* Footer */
        .footer{
            position:fixed; left:0; bottom:0; width:100%;
            height:90px; display:flex; align-items:center; justify-content:center;
            background:var(--card); color:var(--text-dim); border-top:1px solid var(--card-border);
            z-index:1000; padding:0 16px;
            padding-bottom: calc(env(safe-area-inset-bottom,0px));
        }

        /* Toggle */
        #landing-shell{display:block}
        #root{display:none}

        /* AD */
        :root {
            --ad-h: 90px;
            --footer-h: 56px;
        }
        .container.pb-footer {
            padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px));
        }
        .ad-below-menu {
            width: 100vw;
            margin-left: 50%;
            transform: translateX(-50%);
            line-height: 0;
            background: var(--bg);
            padding: 6px 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .ad-below-menu .adsbygoogle {
            display: inline-block !important;
            margin: 0 auto !important;
        }
        .ad-pc { display:inline-block; }
        .ad-mo { display:none; }

        @media (max-width: 900px) {
            :root {
                --ad-h: 100px;
                --footer-h: 60px;
            }

            .ad-pc { display:none; }
            .ad-mo { display:inline-block; }

            .container.pb-footer {
                padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px));
            }
        }

        @supports (padding: max(0px)) {
            .ad-below-menu {
                padding-left:  max(0px, env(safe-area-inset-left));
                padding-right: max(0px, env(safe-area-inset-right));
                padding-top: 20px;
            }
        }

        @media (max-width: 1399px) and (min-width: 1200px) {
            .row{
                width:calc((100% - (var(--grid-gap) * 2)) / 3);
            }
        }

        @media (max-width: 1199px) and (min-width: 901px) {
            .row{
                width:calc((100% - var(--grid-gap)) / 2);
            }
        }

        @media (max-width: 1400px) {
            :root{
                --ROW-W: clamp(260px, 26vw, 340px);
            }
        }

        @media (max-width: 1200px) {
            :root{
                --ROW-W: clamp(300px, 45vw, 420px);
            }
        }

        @media (max-width: 900px){
            :root{
                --ROW-W: min(94vw, 720px);
                --footer-h: 60px;
            }
            .container{ width:100%; padding:14px 12px 24px }
            .topbar{ height:56px; padding:0 12px }
            .hero-title{ font-size:26px }
            .hero-desc{ font-size:0.75rem }
            .hero-break{ display:inline }
            .search-inner{ width:min(92vw,720px) }
            .search-input{ height:44px; border-radius:12px }
            .search-icon .material-icons-outlined{ font-size:20px }
            .tabs-shell{ padding:8px 0 6px }
            .tabs-local{ gap:10px }
            .tab{ padding:7px 6px; font-size:0.75rem }
            .tab-nav{ width:26px; height:26px }
            .rows{
                gap:8px;
                justify-content:stretch;
            }
            .row{ width:100% }
            .row-head{ padding:8px 10px }
            .row-icon{ width:36px; height:36px; border-radius:7px }
            .row-icon .material-icons-outlined{ font-size:18px }
            .row-title{ font-size:0.8125rem }
            .row-acts{ gap:6px; flex-wrap:wrap; row-gap:4px }
            .link{ padding:2px 8px; font-size:0.75rem; min-height:24px }
            .row-desc{
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                line-height:1.2; font-size:0.67rem;
            }
            .pb-footer{ padding-bottom: calc(var(--footer-h) + env(safe-area-inset-bottom,0px)) }
        }
    </style>

    <script type="text/javascript">
      ;(function () {
        var lastScrollY = 0
        var locked = false

        function isEditable(el) {
          if (!el) return false
          var tag = (el.tagName || '').toLowerCase()
          return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable
        }

        function lockScroll() {
          if (locked) return
          locked = true
          lastScrollY = window.scrollY || window.pageYOffset || 0
          document.body.style.position = 'fixed'
          document.body.style.top = -lastScrollY + 'px'
          document.body.style.left = '0'
          document.body.style.right = '0'
          document.body.style.width = '100%'
        }

        function unlockScroll() {
          if (!locked) return
          locked = false
          document.body.style.position = ''
          document.body.style.top = ''
          document.body.style.left = ''
          document.body.style.right = ''
          document.body.style.width = ''
          setTimeout(function () {
            window.scrollTo(0, lastScrollY)
            setTimeout(function () {
              window.scrollTo(0, lastScrollY)
            }, 50)
          }, 50)
        }

        window.addEventListener('focusin', function (e) {
          if (isEditable(e.target)) lockScroll()
        })

        window.addEventListener('focusout', function () {
          setTimeout(unlockScroll, 250)
        })
      })()
    </script>
